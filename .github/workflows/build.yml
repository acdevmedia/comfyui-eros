name: Build and publish 10Eros
on:
  push:
    branches: [develop, main]
    paths-ignore: ['docs/**', 'README.md', 'BRIEF.md']
    tags: ['v1.5.*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: eros-1.5-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate source
        run: |
          bash -n scripts/*.sh
          python3 scripts/check-source.py
          python3 scripts/package-workflows.py
          git diff --exit-code -- versions/1.5/workflows
      - name: Free build disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eros-comfyui" >> "$GITHUB_OUTPUT"
      - name: Build, validate and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: VCS_REF=${{ github.sha }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:1.5
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=eros-1.5
          cache-to: type=gha,mode=max,scope=eros-1.5
          provenance: true
          sbom: true
      - name: Record published digest
        run: echo '${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
